<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>IN-Calc</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/incalc/manifest.json">
    <link rel="stylesheet" type="text/css" href="/style.css">
</head>

<body>
    <div class="maindiv" id="maindiv">
        <h1>IN-Calc</h1>

        <div id="formgrid">
            <form class="gridparent" id="calcform">
                <div class="siderow">
                    <div class="siderowcont">Target data:</div>
                    <div class="siderowcont" id="elevation">00.00</div>
                </div>
                <label class="inputnum" for="distance">Distance</label>
                <input class="inputnum" type="number" id="distance" name="distance" placeholder="12.34" min="0.01" max="30.00" step="0.01">

                <!--                 <div class="inputradio">
                    <label class="inputradio" for="powders1">1</label>
                </div>
                <div class="inputradio">
                    <input class="inputradio" type="radio" id="powders1" name="powders" value="1">
                </div>

                <div class="inputradio">
                    <label class="inputradio" for="powders2">2</label>
                </div>
                <div class="inputradio">
                    <input class="inputradio" type="radio" id="powders2" name="powders" value="2">
                </div>

                <div class="inputradio">
                    <label class="inputradio" for="powders3">3</label>
                </div>
                <div class="inputradio">
                    <input class="inputradio" type="radio" id="powders3" name="powders" value="3">
                </div>

                <div class="inputradio">
                    <label class="inputradio" for="powders4">4</label>
                </div>
                <div class="inputradio">
                    <input class="inputradio" type="radio" id="powders4" name="powders" value="4">
                </div>

                <div class="inputradio">
                    <label class="inputradio" for="powders5">5</label>
                </div>
                <div class="inputradio">
                    <input class="inputradio" type="radio" id="powders5" name="powders" value="5">
                </div>

                <div class="inputradio">
                    <label class="inputradio" for="powders6">6</label>
                </div>
                <div class="inputradio">
                    <input class="inputradio" type="radio" id="powders6" name="powders" value="6">
                </div>
 -->
                <div class="rangediv">
                    <label for="powders">Powders</label><br />
                    <input type="range" id="powders" name="powders" min="1" max="6" step="1" list="values" />

                    <datalist id="values">
                        <option value="1" label="1"></option>
                        <option value="2" label="2"></option>
                        <option value="3" label="3"></option>
                        <option value="4" label="4"></option>
                        <option value="5" label="5"></option>
                        <option value="6" label="6"></option>
                    </datalist>
                </div>


                <label class="inputnum" for="direction">Direction</label>
                <input class="inputnum" type="number" id="direction" name="direction" placeholder="90.0" min="0.0" max="359.9" step="0.1">

                <button type="submit">Submit</button>
            </form>
        </div>
    </div>
    <script>
        const form = document.getElementById('calcform');
        const elevation = document.getElementById('elevation');

        form.addEventListener('submit', (event) => {
            event.preventDefault();

            const formData = new FormData(event.target);

            const distance = formData.get('distance');
            const direction = formData.get('direction');
            const powders = formData.get('powders');

            const maxdistance = 5 * powders;
            const maxangle = 60;
            const calc = distance * 12 / powders;
            elevation.textContent = calc;

/*             console.log('formData:', formData);
            console.log('distance:', distance);
            console.log('direction:', direction);
            console.log('powders:', powders);
            console.log('maxdistance:', maxdistance);
            console.log('maxangle:', maxangle);
            console.log('calc:', calc);
 */        });

    </script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/incalc/sw.js', { scope: '/incalc/' })
                    .then(reg => console.log('Service Worker registered!', reg))
                    .catch(err => console.log('Registration failed: ', err));
            });
        }
    </script>
    <script>
        const disupdate = document.getElementById("distance");
        const powrange = document.getElementById("powders");
        disupdate.addEventListener("input", (event) => {
            const DistanceVal = disupdate.value;
            const CalculatedPowder = Math.ceil(DistanceVal / 5);
            powrange.value = CalculatedPowder;
        });
    </script>
</body>

</html>
